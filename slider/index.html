<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Card Slider</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <main class="container min-vh-100 d-flex flex-column justify-content-center">

    <section class="slider position-relative px-5">

      <button class="prev btn btn-primary rounded-circle position-absolute top-50 start-0 translate-middle-y">&#8249;</button>
      <button class="next btn btn-primary rounded-circle position-absolute top-50 end-0 translate-middle-y">&#8250;</button>

      <!-- 1 card on mobile, 2 on tablet, 4 on desktop -->
      <div class="cards row flex-nowrap overflow-hidden">
        <div class="col-12 col-md-6 col-lg-3">
            <h5 class="card bg-primary text-white p-5 text-center">Ahsan Ali</h5>
        </div>
        <div class="col-12 col-md-6 col-lg-3">
            <h5 class="card bg-primary text-white p-5 text-center">Sakhawat</h5>
        </div>
        <div class="col-12 col-md-6 col-lg-3">
            <h5 class="card bg-primary text-white p-5 text-center">Rahman</h5>
        </div>
        <div class="col-12 col-md-6 col-lg-3">
            <h5 class="card bg-primary text-white p-5 text-center">Abdullah</h5>
        </div>
        <div class="col-12 col-md-6 col-lg-3">
            <h5 class="card bg-primary text-white p-5 text-center">Faizan</h5>
        </div>
        <div class="col-12 col-md-6 col-lg-3">
            <h5 class="card bg-primary text-white p-5 text-center">Saleem</h5>
        </div>
        <div class="col-12 col-md-6 col-lg-3">
            <h5 class="card bg-primary text-white p-5 text-center">Ayesha</h5>
        </div>
        <div class="col-12 col-md-6 col-lg-3">
            <h5 class="card bg-primary text-white p-5 text-center">Nadeem</h5>
        </div>
      </div>
    </section>

  </main>

  <script>
    const slider = document.querySelector('.slider');
    const cards = document.querySelector('.cards');
    let timer;

    // yahan direction ki value aye gi jb ham click karenge 
    function move(direction) {
      const step = cards.firstElementChild.offsetWidth;
      const atEnd = cards.scrollLeft + cards.clientWidth >= cards.scrollWidth - 5;
      const atStart = cards.scrollLeft <= 0;

      if (direction === 1 && atEnd) {
        cards.scrollTo({ left: 0, behavior: 'smooth' });
      } else if (direction === -1 && atStart) {
        cards.scrollTo({ left: cards.scrollWidth, behavior: 'smooth' });
      } else {
        cards.scrollBy({ left: step * direction, behavior: 'smooth' });
      }
    }

    function start() {
      timer = setInterval(() => move(1), 1000);
    }

    document.querySelector('.prev').addEventListener('click', () => move(-1));
    document.querySelector('.next').addEventListener('click', () => move(1));

    // stop when hovering the cards or the arrows
    slider.addEventListener('mouseenter', () => clearInterval(timer));
    slider.addEventListener('mouseleave', start);

    start();
  </script>

</body>
</html>
